{{- define "title" -}}
  {{- .Title -}}
{{- end -}}

{{- define "content" -}}
<div class="page nav-page">
  <style>
    .nav-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .nav-page h1 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .nav-group {
      margin-bottom: 2rem;
    }
    .nav-group-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #eee;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .nav-links a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #f5f5f5;
      color: #333;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }
    .nav-links a:hover {
      background: #e0e0e0;
      color: #0066cc;
    }
  </style>

  <h1>{{ .Title }}</h1>

  {{ range .Params.groups }}
  <div class="nav-group">
    <div class="nav-group-title">{{ .name }}</div>
    <div class="nav-links">
      {{ range .links }}
      <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .name }}</a>
      {{ end }}
    </div>
  </div>
  {{ end }}
</div>
{{- end -}}
