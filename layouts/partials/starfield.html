{{- /* 星空穿梭开场动画（附录 A 脚本，逐字照抄，勿改动画逻辑与时间轴参数） */ -}}
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('space');
  var ctx = canvas.getContext('2d');
  var skipBtn = document.getElementById('skip');
  var main = document.getElementById('main');
  var replay = document.getElementById('replay');

  var W, H, CX, CY, DPR;
  var STAR_COUNT = 700;
  var DEPTH = 1200;          // 星空纵深
  var FOCAL = 320;           // 焦距，控制透视强度
  var stars = [];

  /* 时间轴（秒）。注意：t 从 T_START_AT 开始，保证第一帧就有满天星空 */
  var T_START_AT = 1.0;      // 动画时间的起点（前面的一段被"预演"掉）
  var T_BORN = 1.6;          // 阶段一：星星渐次亮起
  var T_WARP_START = 2.0;    // 阶段二：开始前进
  var T_WARP_END = 4.8;      // 阶段三：到达极速
  var T_STOP = 6.4;          // 阶段四：减速停住
  var T_REVEAL = 4.8;        // 阶段五：开始减速时主页同步浮现，停住时正好浮现完

  var startTime = null;
  var lastNow = null;
  var finished = false;
  var rafId = null;
  var finishTimer = null;

  var STAR_COLORS = [
    [255, 255, 255],   // 纯白（多数）
    [255, 255, 255],
    [255, 255, 255],
    [168, 200, 255],   // 淡蓝
    [255, 217, 160],   // 暖黄
    [255, 179, 186]    // 淡粉（少量）
  ];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function resetStar(s, farOnly) {
    s.x = (Math.random() - 0.5) * W * 2.2;
    s.y = (Math.random() - 0.5) * H * 2.2;
    s.z = farOnly ? DEPTH : Math.random() * DEPTH + 60;
    return s;
  }

  function makeStar() {
    // 以屏幕中心为原点的 3D 坐标
    return resetStar({
      r: 0.8 + Math.random() * 1.5,            // 基础半径
      color: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
      phase: Math.random() * Math.PI * 2,      // 闪烁相位
      freq: 0.8 + Math.random() * 2.4,         // 闪烁频率（周期约 2.4s ~ 7.6s）
      oMin: 0.1 + Math.random() * 0.2,         // 最低透明度
      oMax: 0.55 + Math.random() * 0.45,       // 最高透明度
      born: Math.random() * T_BORN             // 出生时刻（渐次亮起）
    });
  }

  function init() {
    stars.length = 0;
    for (var i = 0; i < STAR_COUNT; i++) stars.push(makeStar());
  }

  /* 缓动函数 */
  function easeInCubic(t) { return t * t * t; }
  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  var MAX_SPEED = 42;    // 极速
  var CRUISE = 0.8;      // 停住后的缓慢漂移（星空仍然"活"着）

  /* 当前前进速度：0 → 极速 → 停住 */
  function speedAt(t) {
    if (t < T_WARP_START) return 0;
    if (t < T_WARP_END) {
      return MAX_SPEED * easeInCubic((t - T_WARP_START) / (T_WARP_END - T_WARP_START));
    }
    if (t < T_STOP) {
      return MAX_SPEED + (CRUISE - MAX_SPEED) * easeOutQuart((t - T_WARP_END) / (T_STOP - T_WARP_END));
    }
    return CRUISE;
  }

  function project(s) {
    var k = FOCAL / s.z;
    return { x: CX + s.x * k, y: CY + s.y * k, k: k };
  }

  function frame(now) {
    if (startTime === null) { startTime = now - T_START_AT * 1000; lastNow = now; }
    var t = (now - startTime) / 1000;
    /* 帧率无关：按真实经过时间推进 */
    var dt = Math.min((now - lastNow) / 1000, 0.1);
    lastNow = now;
    var speed = speedAt(t);

    ctx.clearRect(0, 0, W, H);

    /* 速度感：数值越大拖尾越长 */
    var streakFactor = Math.min(speed / MAX_SPEED, 1);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (t < s.born) continue;

      var prev = project(s);
      s.z -= speed * dt * 60 * (1 + s.r * 0.25);   // 大一点的星稍快，制造层次
      if (s.z < 40) {                    // 飞出屏幕外：回收到远处
        resetStar(s, true);
        prev = project(s);
      }
      var cur = project(s);

      /* 闪烁 */
      var tw = (Math.sin(t * s.freq * Math.PI + s.phase) + 1) / 2;
      var alpha = s.oMin + (s.oMax - s.oMin) * tw;
      /* 出生淡入 */
      alpha *= clamp01((t - s.born) / 0.6);

      var c = s.color;
      var size = s.r * cur.k * 2.4;
      if (size < 0.7) size = 0.7;
      if (size > 3.2) size = 3.2;

      if (streakFactor > 0.06) {
        /* 拖尾：从上一位置画到当前位置 */
        ctx.strokeStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (alpha * streakFactor).toFixed(3) + ')';
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(cur.x, cur.y);
        ctx.stroke();
      }

      /* 星点本体 */
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(cur.x, cur.y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!finished && t >= T_REVEAL) finish();
    /* 星空常驻：动画循环一直运行 */
    rafId = requestAnimationFrame(frame);
  }

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(finishTimer);
    /* 星空保留作背景，只显示主页内容 */
    skipBtn.classList.add('gone');
    main.classList.add('show');
    document.body.style.overflow = '';
  }

  function start() {
    finished = false;
    startTime = null;
    lastNow = null;
    clearTimeout(finishTimer);
    cancelAnimationFrame(rafId);
    skipBtn.classList.remove('gone');
    main.classList.remove('show');
    document.body.style.overflow = 'hidden';
    init();
    /* 立即同步绘制第一帧（满屏星空），再进入动画循环，
       避免任何环境下出现"一片黑"的初始画面 */
    frame(performance.now());
    /* 兜底：即使 rAF 被节流（如后台标签页），也按时展示主页 */
    finishTimer = setTimeout(finish, (T_REVEAL - T_START_AT) * 1000);
  }

  /* 尊重系统减弱动效设置：画一帧静态星空，直接显示主页 */
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    resize();
    init();
    var _raf = window.requestAnimationFrame;
    window.requestAnimationFrame = function () { return 0; };
    frame(performance.now());
    window.requestAnimationFrame = _raf;
    finish();
  } else {
    resize();
    start();
  }

  window.addEventListener('resize', resize);
  skipBtn.addEventListener('click', finish);
  replay.addEventListener('click', start);
})();
</script>
